services:
  api:
    build: .
    container_name: fyp-chatbot-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  telegram-bot:
    build: .
    container_name: fyp-telegram-bot
    env_file:
      - .env
    command: python -m app.telegram_bot
    restart: unless-stopped